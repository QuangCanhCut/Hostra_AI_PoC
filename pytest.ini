# ============================================================
# CẤU HÌNH KIỂM THỬ PYTEST - HOSTRA AI POC
# ============================================================

# File pytest.ini được dùng để thiết lập cấu hình mặc định
# cho framework kiểm thử Pytest trong Python.
#
# Thay vì phải nhập các tham số cấu hình mỗi khi chạy pytest,
# chúng ta có thể lưu sẵn cấu hình trong file này.
# Pytest sẽ tự động đọc và áp dụng khi thực hiện kiểm thử.
#
# Để chạy toàn bộ test, sử dụng lệnh:
# python -m pytest -q


[pytest]

# Bổ sung thư mục src vào đường dẫn tìm kiếm module.
# Giúp các file test import được package hostra_ai.
pythonpath = src

# Chỉ định thư mục chứa các bài kiểm thử của dự án.
testpaths = tests